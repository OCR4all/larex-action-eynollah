name: Test

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  UV_VERSION: "0.9.17"

jobs:
  test:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked --extra cpu --extra test
      - name: Lint
        run: |
          uv run --no-sync ruff check .
          uv run --no-sync ruff format --check .
      - name: Run tests
        run: uv run --no-sync pytest

  models:
    name: Model tests
    runs-on: ubuntu-latest
    env:
      EYNOLLAH_MODEL_DIR: ${{ github.workspace }}/models
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked --extra cpu --extra test
      - name: Cache models
        uses: actions/cache@v4
        with:
          path: models
          key: models-${{ hashFiles('src/larex_action/models.py') }}
      - name: Download models
        run: uv run --no-sync python -m larex_action.models download
      - name: Run model tests
        run: uv run --no-sync pytest -m models

  docker:
    name: Docker build (${{ matrix.flavor }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        flavor: [cpu, gpu]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          build-args: FLAVOR=${{ matrix.flavor }}
          tags: larex-action-eynollah:test
      - name: Start container
        run: |
          docker run --detach --name action --read-only --tmpfs /tmp \
            --env LAREX_PROCESSOR_ID=eynollah-segmentation \
            --env LAREX_DISPATCH_HMAC_SECRET=test-dispatch-secret \
            --env 'LAREX_ALLOWED_CALLBACK_ORIGINS=["https://larex.example.org"]' \
            larex-action-eynollah:test
          for _ in $(seq 30); do
            [ "$(docker inspect --format '{{.State.Health.Status}}' action)" = healthy ] && exit 0
            sleep 2
          done
          docker logs action
          exit 1
      - name: Load the analysis engine
        run: docker exec action python -c "import larex_action.engine"
